name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check scripts syntax
        run: |
          node --check patch-minimax-official.cjs
          node --check repair-dsh-at-file.cjs
      - name: Read version
        id: ver
        run: 'echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"'
      - name: Build bundle archive
        run: |
          mkdir -p dist
          zip -j "dist/dsh-plugin-patches-${{ steps.ver.outputs.version }}.zip" \
            patch-minimax-official.cjs repair-dsh-at-file.cjs README.md LICENSE package.json
      - name: Clean previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag=false || true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "dist/dsh-plugin-patches-${{ steps.ver.outputs.version }}.zip" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
